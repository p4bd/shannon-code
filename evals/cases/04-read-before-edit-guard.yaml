{
  "name": "read-before-edit guard",
  "prompt": "Edit src/example.ts without reading it first.",
  "permissionMode": "acceptEdits",
  "workspace": {
    "files": {
      "src/example.ts": "export const value = \"foo\";\n"
    }
  },
  "mock": {
    "steps": [
      {
        "toolCalls": [
          {
            "name": "edit_file",
            "input": {
              "path": "src/example.ts",
              "oldString": "foo",
              "newString": "bar"
            }
          }
        ]
      },
      { "content": "The edit was blocked by the read-before-edit guard." }
    ]
  },
  "assertions": [
    { "type": "tool_called", "name": "edit_file" },
    { "type": "session_contains", "text": "ReadBeforeEditRequired" },
    { "type": "file_contains", "path": "src/example.ts", "text": "foo" }
  ]
}

