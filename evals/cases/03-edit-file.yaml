{
  "name": "edit file",
  "prompt": "Change foo to bar in src/example.ts.",
  "permissionMode": "acceptEdits",
  "workspace": {
    "files": {
      "src/example.ts": "export const value = \"foo\";\n"
    }
  },
  "mock": {
    "steps": [
      {
        "toolCalls": [
          { "name": "read_file", "input": { "path": "src/example.ts" } }
        ]
      },
      {
        "toolCalls": [
          {
            "name": "edit_file",
            "input": {
              "path": "src/example.ts",
              "oldString": "foo",
              "newString": "bar"
            }
          }
        ]
      },
      { "content": "Changed foo to bar." }
    ]
  },
  "assertions": [
    { "type": "file_contains", "path": "src/example.ts", "text": "bar" },
    { "type": "file_not_contains", "path": "src/example.ts", "text": "foo" },
    { "type": "tool_called", "name": "edit_file" }
  ]
}

